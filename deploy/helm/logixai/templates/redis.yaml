{{- if .Values.redis.bundled }}
{{- /* A single Redis for queues and socket fan-out. Use a managed Redis for real traffic. */}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels: {{- include "logixai.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: {{- include "logixai.labels" . | nindent 8 }}
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # Append-only file: queued judge jobs survive a restart. BullMQ needs noeviction.
          command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass \"$REDIS_PASSWORD\""]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: REDIS_PASSWORD } }
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping | grep -q PONG"] }
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.redis.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {{- include "logixai.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
{{- end }}

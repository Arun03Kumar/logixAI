{{- /*
  Migrations run before every install and upgrade (Helm hooks), one Job per
  service with a database, using that service's new image. The upgrade only
  continues when they succeed. Each service's migrations take a lock in its own
  database, so a re-run is safe.
*/ -}}
{{- $root := . }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.migrate }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-migrate
  labels: {{- include "logixai.labels" $root | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: {{- include "logixai.labels" $root | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}-migrate
    spec:
      restartPolicy: Never
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
      containers:
        - name: migrate
          image: {{ include "logixai.image" (dict "root" $root "name" $svc.image) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["node", {{ $svc.migrate | quote }}]
          env:
            - name: NODE_ENV
              value: production
            {{- include "logixai.mongoEnv" (dict "root" $root "database" $svc.database) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
{{- end }}
{{- end }}

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

  # The deployment files stay valid: Compose config, Helm lint and render.
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose config
        run: |
          sed -e 's#^MONGODB_URI_BASE=$#MONGODB_URI_BASE=mongodb://mongo:27017#' \
              -e 's#^REDIS_PASSWORD=$#REDIS_PASSWORD=ci-placeholder#' \
              -e 's#^JWT_PRIVATE_KEY=$#JWT_PRIVATE_KEY=ci-placeholder#' \
              -e 's#^INTERNAL_API_TOKEN=$#INTERNAL_API_TOKEN=ci-placeholder-token#' \
              deploy/compose/.env.example > /tmp/compose.env
          docker compose -f deploy/compose/compose.yml --env-file /tmp/compose.env config --quiet

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Helm lint and render
        run: |
          helm lint deploy/helm/logixai
          helm template ci deploy/helm/logixai > /tmp/rendered.yaml

      - name: Validate Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary /tmp/rendered.yaml

      - name: Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/helm/logixai/files/alerts.yml:/alerts.yml:ro"             prom/prometheus:v2.54.1 check rules /alerts.yml
          sed 's#/etc/prometheus/alerts.yml#/alerts.yml#' deploy/monitoring/prometheus.yml > /tmp/prometheus.yml
          docker run --rm --entrypoint promtool -v /tmp/prometheus.yml:/prometheus.yml:ro             -v "$PWD/deploy/helm/logixai/files/alerts.yml:/alerts.yml:ro" prom/prometheus:v2.54.1 check config /prometheus.yml

      - name: Caddyfile
        run: |
          docker run --rm -e SITE_ADDRESS=example.com -v "$PWD/deploy/helm/logixai/files/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # Run in the browser: every item marked browser-safe still gives the judge's
  # answers in Pyodide, and the committed record is up to date.
  browser-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx turbo run build --filter=@logixai/arena-service^...

      - uses: actions/cache@v4
        with:
          path: apps/arena-service/.cache/pyodide
          key: pyodide-${{ hashFiles('apps/arena-service/src/content/browserRun.ts') }}

      - run: npm run content:browser-check

      - name: Record is up to date
        run: git diff --exit-code apps/arena-service/content/browser-run.generated.json

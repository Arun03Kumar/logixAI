id: maths-probability
title: Probability
summary: Sample spaces and events, the addition rule with Venn diagrams and contingency tables, conditional probability, independence and the multiplication rule, and the law of total probability and Bayes' theorem — the logic behind Naive Bayes and every medical-test puzzle.
prerequisites: [maths-counting]
lesson: |
  ## 7.1 Probability basics

  An **experiment** has a **sample space** $S$ of outcomes; an **event** is a set of outcomes. Probabilities satisfy $0 \le P(A) \le 1$, $P(S) = 1$, and the **complement** $P(A^c) = 1 - P(A)$. With equally likely outcomes, $P(A) = |A| / |S|$; otherwise probabilities are often estimated as long-run frequencies from data.

  ## 7.2 Addition rule, Venn diagrams and contingency tables

  $$P(A \cup B) = P(A) + P(B) - P(A \cap B)$$

  Subtract the overlap so it isn't counted twice. **Mutually exclusive** events can't happen together ($P(A \cap B) = 0$), so their probabilities simply add. A **contingency table** (counts by two categorical variables) lets you read joint, marginal and conditional probabilities directly — it's what `pd.crosstab` produces.

  ## 7.3 Conditional probability, multiplication rule and independence

  $$P(A \mid B) = \frac{P(A \cap B)}{P(B)} \qquad P(A \cap B) = P(A \mid B)\,P(B)$$

  $P(A \mid B)$ restricts attention to the cases where $B$ happened. $A$ and $B$ are **independent** if $P(A \mid B) = P(A)$, equivalently $P(A \cap B) = P(A)P(B)$. Independent is not the same as mutually exclusive — exclusive events (with nonzero probabilities) are strongly *dependent*: one happening rules out the other. Naive Bayes classifiers assume features are independent given the class.

  ## 7.4 Total probability and Bayes' theorem

  If $B_1, \dots, B_k$ split the sample space, $P(A) = \sum_i P(A \mid B_i)P(B_i)$. **Bayes' theorem** reverses a conditional:

  $$P(B \mid A) = \frac{P(A \mid B)\,P(B)}{P(A)}$$

  The prior $P(B)$ matters enormously. A test that's 99% sensitive and 95% specific for a disease with 1% prevalence gives a positive result that's correct only about 17% of the time — most positives come from the large healthy group. The same base-rate effect explains why fraud and spam detectors with high accuracy still flag many false alarms.
items:
  - id: m1s7-complement
    type: numeric
    title: At least one
    difficulty: easy
    tags: [probability, complement]
    prompt: |
      Each of 3 independent servers is down with probability 0.1. What is the probability that **at least one** is down? (Three decimals.)
    answer: 0.271
    tolerance: 0.001
    explanation: |
      $1 - P(\text{all up}) = 1 - 0.9^3 = 1 - 0.729 = 0.271$. "At least one" questions are almost always easiest through the complement.

  - id: m1s7-addition
    type: numeric
    title: The addition rule
    difficulty: easy
    tags: [probability, addition-rule]
    prompt: |
      40% of users use the mobile app, 70% use the website, and 25% use both. What fraction uses at least one of them?
    answer: 0.85
    tolerance: 0.001
    explanation: |
      $0.40 + 0.70 - 0.25 = 0.85$. Adding without subtracting the overlap gives 1.10 — more than 100%, a sure sign of double counting.

  - id: m1s7-contingency
    type: numeric
    title: Read a contingency table
    difficulty: medium
    tags: [probability, conditional]
    prompt: |
      Of 200 customers, 80 bought a premium plan. Among the 50 who came from ads, 30 bought premium. What is $P(\text{premium} \mid \text{came from ads})$?
    answer: 0.6
    tolerance: 0.001
    explanation: |
      Restrict to the 50 ad customers: $30/50 = 0.6$, compared with the overall $80/200 = 0.4$. Because $P(\text{premium} \mid \text{ads}) \ne P(\text{premium})$, plan choice and channel are **not** independent.

  - id: m1s7-independence
    type: mcq_single
    title: Independent or exclusive?
    difficulty: medium
    tags: [probability, independence]
    prompt: |
      $P(A) = 0.3$, $P(B) = 0.5$ and $P(A \cap B) = 0.15$. Which is true?
    options:
      - { id: a, text: "A and B are independent" }
      - { id: b, text: "A and B are mutually exclusive" }
      - { id: c, text: "Both" }
      - { id: d, text: "Neither" }
    answer: a
    explanation: |
      $P(A)P(B) = 0.15 = P(A \cap B)$, the definition of independence. They're not exclusive, since they can happen together (probability 0.15).

  - id: m1s7-multiplication
    type: numeric
    title: Drawing without replacement
    difficulty: medium
    tags: [probability, multiplication-rule]
    prompt: |
      A batch of 10 emails contains 3 spam. Two are drawn at random without replacement. What is the probability both are spam? (Four decimals.)
    answer: 0.0667
    tolerance: 0.0001
    explanation: |
      $P(\text{1st spam}) \times P(\text{2nd spam} \mid \text{1st spam}) = \frac{3}{10}\times\frac{2}{9} = \frac{6}{90} \approx 0.0667$. Without replacement, the second draw depends on the first.

  - id: m1s7-bayes
    type: numeric
    title: The base-rate surprise
    difficulty: hard
    tags: [probability, bayes]
    prompt: |
      A disease affects 1% of people. A test detects it in 99% of sick people (sensitivity) and gives a false positive for 5% of healthy people. A person tests positive. What is the probability they're sick? (Three decimals.)
    answer: 0.167
    tolerance: 0.002
    explanation: |
      $P(+) = 0.99 \times 0.01 + 0.05 \times 0.99 = 0.0099 + 0.0495 = 0.0594$. Then $P(\text{sick} \mid +) = 0.0099 / 0.0594 \approx 0.167$. Out of 10,000 people, 99 sick people test positive but so do 495 healthy ones. This is why rare-event classifiers need precision, not just accuracy.

  - id: m1s7-total-probability
    type: numeric
    title: Total probability
    difficulty: medium
    tags: [probability, total-probability]
    prompt: |
      A factory has machines A (60% of output, 2% defective) and B (40% of output, 5% defective). What fraction of all output is defective?
    answer: 0.032
    tolerance: 0.0005
    explanation: |
      $0.6 \times 0.02 + 0.4 \times 0.05 = 0.012 + 0.020 = 0.032$. Weighting each group's rate by its share is the law of total probability.

  - id: m1s7-bayes-code
    type: code
    title: Bayes' theorem as a function
    difficulty: medium
    tags: [probability, bayes, python]
    prompt: |
      Write `posterior(prior, sensitivity, false_positive_rate)` returning $P(\text{condition} \mid \text{positive test})$, rounded to 4 decimals. If the probability of a positive test is 0, return `0.0`.
    function:
      name: posterior
      params:
        - { name: prior, type: float }
        - { name: sensitivity, type: float }
        - { name: false_positive_rate, type: float }
      returns: "float"
    starter: |
      def posterior(prior, sensitivity, false_positive_rate):
          return round(sensitivity, 4)
    solution: |
      def posterior(prior, sensitivity, false_positive_rate):
          p_positive = sensitivity * prior + false_positive_rate * (1 - prior)
          if p_positive == 0:
              return 0.0
          return round(sensitivity * prior / p_positive, 4)
    tests:
      sample:
        - args: [0.01, 0.99, 0.05]
      hidden:
        - args: [0.5, 0.9, 0.1]
        - args: [0, 0.9, 0]
        - args: [0.001, 1.0, 0.01]
    explanation: |
      The denominator is the total probability of a positive test from both groups. Confusing $P(+ \mid \text{sick})$ (the sensitivity) with $P(\text{sick} \mid +)$ — the starter's mistake — is the "prosecutor's fallacy".

  - id: m1s7-simulate
    type: code
    title: Check it by simulation
    difficulty: medium
    tags: [probability, simulation, numpy]
    prompt: |
      Estimate by simulation the probability that the sum of two fair dice is at least 10. Write `estimate(trials, seed)` using `np.random.default_rng(seed)`, rolling `trials` pairs with `rng.integers(1, 7, size=(trials, 2))`, and returning the fraction of rows whose sum is at least 10.
    function:
      name: estimate
      params:
        - { name: trials, type: int }
        - { name: seed, type: int }
      returns: "float"
    starter: |
      import numpy as np

      def estimate(trials, seed):
          rng = np.random.default_rng(seed)
          rolls = rng.integers(1, 6, size=(trials, 2))
          return float((rolls.sum(axis=1) >= 10).mean())
    solution: |
      import numpy as np

      def estimate(trials, seed):
          rng = np.random.default_rng(seed)
          rolls = rng.integers(1, 7, size=(trials, 2))
          return float((rolls.sum(axis=1) >= 10).mean())
    tests:
      sample:
        - args: [100000, 1]
      hidden:
        - args: [1000, 7]
    explanation: |
      The exact answer is $6/36 \approx 0.1667$ (outcomes (4,6), (5,5), (6,4), (5,6), (6,5), (6,6)), and 100,000 simulated rolls land within about 0.002 of it. `integers(1, 7)` excludes the upper bound — the starter's `integers(1, 6)` never rolls a 6. Simulation is a quick sanity check for any probability you compute by hand.

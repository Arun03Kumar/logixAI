id: maths-differentiation
title: Differentiation
summary: Limits and what a derivative means, the derivative rules, the chain rule that powers backpropagation, partial derivatives and gradients, maxima, minima and convexity, and gradient descent worked by hand.
prerequisites: [maths-vectors-matrices]
lesson: |
  ## 3.1 Limits and the idea of a derivative

  The derivative is the **instantaneous rate of change** — the slope of the tangent line:

  $$f'(x) = \lim_{h \to 0} \frac{f(x + h) - f(x)}{h}$$

  In ML, the derivative of the loss with respect to a weight says how the loss changes if you nudge that weight — which direction to move it to improve the model. A **numerical derivative** $\frac{f(x+h) - f(x-h)}{2h}$ with small $h$ approximates it and is used to check hand-written gradients.

  ## 3.2 Derivative rules

  | Function | Derivative |
  | --- | --- |
  | $c$ | $0$ |
  | $x^n$ | $n x^{n-1}$ |
  | $e^x$ | $e^x$ |
  | $\ln x$ | $1/x$ |
  | $c\,f(x)$, $f + g$ | $c\,f'$, $f' + g'$ |
  | $f g$ (product) | $f' g + f g'$ |
  | $f / g$ (quotient) | $(f' g - f g') / g^2$ |

  ## 3.3 The chain rule

  For a composition $h(x) = f(g(x))$: $h'(x) = f'(g(x)) \cdot g'(x)$ — the outer derivative (at the inner value) times the inner derivative. A neural network is a long composition, and **backpropagation is the chain rule applied layer by layer**, from the loss back to each weight. Useful results: $\sigma'(z) = \sigma(z)(1 - \sigma(z))$ for the sigmoid; ReLU's derivative is 1 for $z > 0$ and 0 for $z < 0$.

  ## 3.4 Partial derivatives and the gradient

  For a function of several variables, the **partial derivative** $\partial f / \partial x$ differentiates with respect to one variable, treating the others as constants. The **gradient** collects them: $\nabla f = \left(\frac{\partial f}{\partial x_1}, \dots, \frac{\partial f}{\partial x_n}\right)$. It points in the direction of **steepest increase**; $-\nabla f$ points downhill.

  ## 3.5 Maxima, minima and convexity

  At a smooth maximum or minimum, $f'(x) = 0$ (a **critical point**). The second derivative tells which: $f'' > 0$ is a minimum (curving up), $f'' < 0$ a maximum. A **convex** function ($f'' \ge 0$ everywhere, bowl-shaped) has a single global minimum, so gradient descent can't get stuck — linear and logistic regression losses are convex; neural network losses are not.

  ## 3.6 Gradient descent by hand

  Repeat: $w \leftarrow w - \eta\, \nabla L(w)$, with **learning rate** $\eta$. Too small: slow progress. Too large: overshooting and divergence. Example: $L(w) = (w - 3)^2$, $L'(w) = 2(w - 3)$; from $w = 0$ with $\eta = 0.1$: $w_1 = 0 - 0.1 \cdot (-6) = 0.6$, then $w_2 = 0.6 - 0.1 \cdot (-4.8) = 1.08$, approaching 3.
items:
  - id: m1s3-power-rule
    type: numeric
    title: Power rule
    difficulty: easy
    tags: [derivatives]
    prompt: |
      $f(x) = 3x^4 - 2x^2 + 7x - 5$. What is $f'(1)$?
    answer: 15
    tolerance: 0
    explanation: |
      $f'(x) = 12x^3 - 4x + 7$, so $f'(1) = 12 - 4 + 7 = 15$. Constants disappear and each power drops by one.

  - id: m1s3-product
    type: mcq_single
    title: Product rule
    difficulty: easy
    tags: [derivatives]
    prompt: |
      What is the derivative of $x^2 e^x$?
    options:
      - { id: a, text: "$2x e^x$" }
      - { id: b, text: "$x^2 e^x$" }
      - { id: c, text: "$2x e^x + x^2 e^x$" }
      - { id: d, text: "$2x \\cdot e^x \\cdot x^2$" }
    answer: c
    explanation: |
      $(fg)' = f'g + fg'$ with $f = x^2$, $g = e^x$: $2x e^x + x^2 e^x = (2x + x^2)e^x$. Differentiating each factor and multiplying is the classic mistake.

  - id: m1s3-chain
    type: numeric
    title: Chain rule
    difficulty: medium
    tags: [derivatives, chain-rule]
    prompt: |
      $h(x) = (3x + 1)^5$. What is $h'(0)$?
    answer: 15
    tolerance: 0
    explanation: |
      Outer: $5u^4$ at $u = 3x + 1$; inner derivative 3. $h'(x) = 15(3x + 1)^4$, so $h'(0) = 15$. Backpropagation multiplies such local derivatives along the path from the loss to each weight.

  - id: m1s3-sigmoid-derivative
    type: numeric
    title: The sigmoid's slope
    difficulty: medium
    tags: [derivatives, sigmoid]
    prompt: |
      Using $\sigma'(z) = \sigma(z)(1 - \sigma(z))$, what is $\sigma'(0)$? And what's the largest value $\sigma'$ ever takes?
    answer: 0.25
    tolerance: 0.001
    answerFormat: "the value of σ'(0)"
    explanation: |
      $\sigma(0) = 0.5$, so $\sigma'(0) = 0.25$ — and that's the maximum. Multiplying many factors of at most 0.25 through deep sigmoid networks shrinks gradients towards zero (the **vanishing gradient** problem), one reason ReLU replaced sigmoid in hidden layers.

  - id: m1s3-partials
    type: mcq_single
    title: Partial derivatives
    difficulty: medium
    tags: [derivatives, gradient]
    prompt: |
      $f(x, y) = x^2 y + 3y^2$. What is the gradient $\nabla f$ at $(1, 2)$?
    options:
      - { id: a, text: "$(4, 13)$" }
      - { id: b, text: "$(2, 13)$" }
      - { id: c, text: "$(4, 12)$" }
      - { id: d, text: "$(4, 1)$" }
    answer: a
    explanation: |
      $\partial f/\partial x = 2xy = 4$; $\partial f/\partial y = x^2 + 6y = 1 + 12 = 13$. Each partial treats the other variable as a constant.

  - id: m1s3-critical
    type: mcq_single
    title: Minimum or maximum?
    difficulty: medium
    tags: [derivatives, optimisation]
    prompt: |
      $f(x) = x^3 - 3x$. At its critical points, which is true?
    options:
      - { id: a, text: "$x = 1$ is a minimum and $x = -1$ is a maximum" }
      - { id: b, text: "$x = 1$ is a maximum and $x = -1$ is a minimum" }
      - { id: c, text: "Both are minima" }
      - { id: d, text: "It has no critical points" }
    answer: a
    explanation: |
      $f'(x) = 3x^2 - 3 = 0$ at $x = \pm 1$; $f''(x) = 6x$ is positive at 1 (minimum) and negative at −1 (maximum). These are *local* — the cubic heads to $\pm\infty$ — which is why non-convex losses can trap gradient descent.

  - id: m1s3-gd-steps
    type: numeric
    title: Gradient descent by hand
    difficulty: medium
    tags: [gradient-descent, optimisation]
    prompt: |
      Minimise $L(w) = (w - 3)^2$ by gradient descent from $w_0 = 0$ with learning rate $\eta = 0.25$. What is $w_2$, after two steps?
    answer: 2.25
    tolerance: 0.001
    explanation: |
      $L'(w) = 2(w - 3)$. Step 1: $w_1 = 0 - 0.25 \cdot (-6) = 1.5$. Step 2: $w_2 = 1.5 - 0.25 \cdot (-3) = 2.25$. Each step halves the distance to the minimum at 3. With $\eta = 1$ the steps would jump between 0 and 6 forever.

  - id: m1s3-numerical-derivative
    type: code
    title: Check a derivative numerically
    difficulty: medium
    tags: [derivatives, numerical]
    prompt: |
      Implement `numeric_derivative(coeffs, x, h)` for the polynomial $f(x) = \sum_k c_k x^k$ (`coeffs[k]` is $c_k$) using the **central difference** $\frac{f(x+h) - f(x-h)}{2h}$. Return the estimate.
    function:
      name: numeric_derivative
      params:
        - { name: coeffs, type: list }
        - { name: x, type: float }
        - { name: h, type: float }
      returns: "float"
    starter: |
      def numeric_derivative(coeffs, x, h):
          f = lambda t: sum(c * t ** k for k, c in enumerate(coeffs))
          return (f(x + h) - f(x)) / h
    solution: |
      def numeric_derivative(coeffs, x, h):
          f = lambda t: sum(c * t ** k for k, c in enumerate(coeffs))
          return (f(x + h) - f(x - h)) / (2 * h)
    tests:
      sample:
        - args: [[0, 0, 1], 3, 0.001]
      hidden:
        - args: [[5, -2, 0, 1], 2, 0.001]
        - args: [[1, 1, 1, 1, 1], -1, 0.01]
    tolerance: { abs: 1.0e-6, rel: 1.0e-6 }
    explanation: |
      The central difference cancels the first error term, so its error shrinks like $h^2$ instead of $h$ (the forward difference in the starter). Deep-learning frameworks are tested with exactly this "gradient check" against their analytic gradients.

  - id: m1s3-gradient-descent
    type: code
    title: Gradient descent for a line
    difficulty: hard
    tags: [gradient-descent, linear-regression]
    prompt: |
      Fit $\hat y = wx + b$ to data by gradient descent on the mean squared error $L = \frac{1}{n}\sum (wx_i + b - y_i)^2$. Start from $w = b = 0$, take `steps` updates with learning rate `lr`, using

      $$\frac{\partial L}{\partial w} = \frac{2}{n}\sum (wx_i + b - y_i)\,x_i \qquad \frac{\partial L}{\partial b} = \frac{2}{n}\sum (wx_i + b - y_i)$$

      and update both from the **same** step's gradients. Return `[w, b]`.
    function:
      name: fit_line
      params:
        - { name: xs, type: list }
        - { name: ys, type: list }
        - { name: lr, type: float }
        - { name: steps, type: int }
      returns: "[w, b]"
    starter: |
      def fit_line(xs, ys, lr, steps):
          w = b = 0.0
          n = len(xs)
          for _ in range(steps):
              w -= lr * 2 / n * sum((w * x + b - y) * x for x, y in zip(xs, ys))
              b -= lr * 2 / n * sum(w * x + b - y for x, y in zip(xs, ys))
          return [w, b]
    solution: |
      def fit_line(xs, ys, lr, steps):
          w = b = 0.0
          n = len(xs)
          for _ in range(steps):
              errors = [w * x + b - y for x, y in zip(xs, ys)]
              dw = 2 / n * sum(e * x for e, x in zip(errors, xs))
              db = 2 / n * sum(errors)
              w, b = w - lr * dw, b - lr * db
          return [w, b]
    tests:
      sample:
        - args: [[0, 1, 2, 3], [1, 3, 5, 7], 0.05, 2]
      hidden:
        - args: [[1, 2, 3, 4, 5], [2, 4, 6, 8, 10], 0.01, 500]
        - args: [[0, 1], [5, 5], 0.1, 1]
    tolerance: { abs: 1.0e-6, rel: 1.0e-6 }
    explanation: |
      Compute both gradients from the current $(w, b)$, then update together. The starter updates $w$ first and uses the **new** $w$ for $b$'s gradient — a subtly different algorithm that gives different numbers. On the sample data the line converges towards $y = 2x + 1$.

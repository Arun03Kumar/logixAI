# Practice databases for SQL items (DuckDB). Any topic's sql items can use
# them by name. Each has a small dataset learners see (`small`) and hidden
# ones with more rows, ties, NULLs and empty groups (`full`, `edge`), so a
# query that only works on the example fails Submit.
#
# Rows are positional, in the column order of the table.


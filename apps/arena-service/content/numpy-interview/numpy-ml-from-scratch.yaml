id: numpy-ml-from-scratch
title: ML from scratch
summary: Stable log-softmax, cross-entropy, backprop through ReLU and a linear layer, BatchNorm, ridge regression, k-NN, a k-means step and ROC AUC — in plain NumPy.
prerequisites: [numpy-vectorisation, logistic-regression]
lesson: |
  ## What the interviewer is checking

  "Implement X in NumPy" questions test three things at once: that you know the maths, that you can vectorise it, and that you handle numerical edge cases. Say the formula first, write it with array operations, then mention what could overflow, divide by zero or tie.

  ## Numerical stability

  `exp(1000)` overflows to `inf`. Softmax and log-softmax don't change when you subtract a constant from every logit, so subtract the row maximum first:

  $$\log \operatorname{softmax}(z)_i = z_i - m - \log \sum_j e^{z_j - m}, \quad m = \max_j z_j$$

  Before taking `log(p)`, clip probabilities away from 0.

  ## Backprop, one layer at a time

  For a linear layer $Y = XW + b$ with upstream gradient $G = \partial L / \partial Y$:

  $$\frac{\partial L}{\partial W} = X^\top G, \qquad \frac{\partial L}{\partial b} = \sum_{\text{rows}} G, \qquad \frac{\partial L}{\partial X} = G W^\top$$

  Check shapes: each gradient has the shape of the thing it's the gradient of. For ReLU, the gradient passes through where the input was positive and is 0 elsewhere.

  ## Algorithms in a few lines

  - **k-NN**: distances from each test point to every training point, `argsort`, vote among the first `k`.
  - **k-means step**: assign each point to its nearest centroid (`argmin` over a distance matrix), then move each centroid to the mean of its points.
  - **ROC AUC**: the probability that a random positive is scored above a random negative (ties count half).
items:
  - id: np-log-softmax
    type: code
    title: Stable log-softmax
    difficulty: medium
    tags: [numpy, softmax, numerical-stability]
    prompt: |
      Implement `log_softmax(Z)` for an `(n, k)` array of logits: the log of the softmax of each row. It must work for huge logits like 1000 (no `inf` or `nan`).
    function:
      name: log_softmax
      params:
        - { name: Z, type: ndarray }
      returns: "ndarray (n, k)"
    starter: |
      import numpy as np

      def log_softmax(Z):
          E = np.exp(Z)
          return np.log(E / E.sum(axis=1, keepdims=True))
    solution: |
      import numpy as np

      def log_softmax(Z):
          shifted = Z - Z.max(axis=1, keepdims=True)
          return shifted - np.log(np.exp(shifted).sum(axis=1, keepdims=True))
    tests:
      sample:
        - args: [[[1, 2, 3], [1000, 1000, 1000]]]
      generate: |
        def cases(rng):
            return [[rng.normal(size=(6, 4)) * 5], [rng.normal(size=(3, 10)) * 300]]
    explanation: |
      Subtracting each row's maximum makes the largest exponent `exp(0) = 1`, so nothing overflows, and the log of the sum is computed on safe numbers. Taking `log(softmax)` directly also fails when a probability underflows to 0 (`log 0 = −inf`).

  - id: np-cross-entropy
    type: code
    title: Multi-class cross-entropy
    difficulty: easy
    tags: [numpy, loss, classification]
    prompt: |
      Implement `cross_entropy(P, y)`: given predicted probabilities `P` of shape `(n, k)` (rows sum to 1) and integer labels `y`, return the **mean** of $-\log P_{i, y_i}$. Clip probabilities to at least `1e-12` before the log.
    function:
      name: cross_entropy
      params:
        - { name: P, type: ndarray }
        - { name: y, type: ndarray_int }
      returns: "float"
    starter: |
      import numpy as np

      def cross_entropy(P, y):
          return float(-np.log(P).mean())
    solution: |
      import numpy as np

      def cross_entropy(P, y):
          p = np.clip(P[np.arange(len(y)), y], 1e-12, None)
          return float(-np.log(p).mean())
    tests:
      sample:
        - args: [[[0.7, 0.2, 0.1], [0.1, 0.1, 0.8]], [0, 2]]
      hidden:
        - args: [[[1.0, 0.0], [0.0, 1.0], [0.5, 0.5]], [1, 1, 0]]
      generate: |
        def cases(rng):
            out = []
            for n, k in [(10, 3), (40, 7)]:
                Z = rng.normal(size=(n, k))
                P = np.exp(Z) / np.exp(Z).sum(axis=1, keepdims=True)
                out.append([P, rng.integers(0, k, size=n)])
            return out
    explanation: |
      `P[np.arange(n), y]` picks each row's probability for its true class (fancy indexing with two arrays). The starter averages the log of every probability, not just the true class's. Clipping keeps a confident wrong prediction (probability 0) from giving infinity.

  - id: np-relu-backward
    type: code
    title: Backprop through ReLU
    difficulty: easy
    tags: [numpy, backprop, deep-learning]
    prompt: |
      A ReLU layer computed `out = max(x, 0)`. Implement `relu_backward(dout, x)`: the gradient of the loss with respect to `x`, given the gradient `dout` with respect to `out`. Use gradient 0 where `x` is exactly 0.
    function:
      name: relu_backward
      params:
        - { name: dout, type: ndarray }
        - { name: x, type: ndarray }
      returns: "ndarray, same shape as x"
    starter: |
      import numpy as np

      def relu_backward(dout, x):
          return dout
    solution: |
      import numpy as np

      def relu_backward(dout, x):
          return dout * (x > 0)
    tests:
      sample:
        - args: [[[1, 2], [3, 4]], [[-1, 0.5], [0, 2]]]
          expected: [[0, 2], [0, 4]]
      generate: |
        def cases(rng):
            return [[rng.normal(size=(5, 3)), rng.normal(size=(5, 3))], [rng.normal(size=(2, 8)), rng.normal(size=(2, 8))]]
    explanation: |
      ReLU's derivative is 1 where its input was positive and 0 elsewhere, so the upstream gradient passes through unchanged where `x > 0` and is blocked otherwise. Multiplying by the boolean mask does it in one step.

  - id: np-linear-backward
    type: code
    title: Backprop through a linear layer
    difficulty: medium
    tags: [numpy, backprop, deep-learning]
    prompt: |
      A layer computed `Y = X @ W + b` with `X: (n, d)`, `W: (d, m)`, `b: (m,)`. Implement `linear_backward(X, W, dY)`: given `dY = ∂L/∂Y` of shape `(n, m)`, return `[dX, dW, db]`.
    function:
      name: linear_backward
      params:
        - { name: X, type: ndarray }
        - { name: W, type: ndarray }
        - { name: dY, type: ndarray }
      returns: "[dX (n, d), dW (d, m), db (m,)]"
    starter: |
      import numpy as np

      def linear_backward(X, W, dY):
          return [dY @ W, X @ dY, dY.mean(axis=0)]
    solution: |
      import numpy as np

      def linear_backward(X, W, dY):
          return [dY @ W.T, X.T @ dY, dY.sum(axis=0)]
    tests:
      sample:
        - args: [[[1, 2]], [[1, 0, -1], [2, 1, 0]], [[1, 1, 1]]]
          expected: [[[0, 3]], [[1, 1, 1], [2, 2, 2]], [1, 1, 1]]
      generate: |
        def cases(rng):
            return [[rng.normal(size=(n, d)), rng.normal(size=(d, m)), rng.normal(size=(n, m))] for n, d, m in [(4, 3, 2), (10, 5, 7)]]
    hints:
      - Each gradient has the same shape as the thing it's the gradient of. Which product of the given arrays has shape `(d, m)`?
    explanation: |
      `dW = Xᵀ dY` (sum over the batch of outer products), `dX = dY Wᵀ`, and `db` sums `dY` over the batch because `b` was added to every row. Matching shapes is the fastest way to get the transposes right.

  - id: np-batchnorm-forward
    type: code
    title: Batch normalisation (forward)
    difficulty: medium
    tags: [numpy, deep-learning, normalisation]
    prompt: |
      Implement `batchnorm(X, gamma, beta, eps)` in training mode: normalise each **feature** (column) of the batch `X` with the batch mean and variance (`ddof=0`), then scale by `gamma` and shift by `beta`:

      $$y = \gamma \cdot \frac{x - \mu}{\sqrt{\sigma^2 + \epsilon}} + \beta$$
    function:
      name: batchnorm
      params:
        - { name: X, type: ndarray }
        - { name: gamma, type: ndarray }
        - { name: beta, type: ndarray }
        - { name: eps, type: float }
      returns: "ndarray, same shape as X"
    starter: |
      import numpy as np

      def batchnorm(X, gamma, beta, eps):
          return gamma * (X - X.mean()) / np.sqrt(X.var() + eps) + beta
    solution: |
      import numpy as np

      def batchnorm(X, gamma, beta, eps):
          mu = X.mean(axis=0)
          var = X.var(axis=0)
          return gamma * (X - mu) / np.sqrt(var + eps) + beta
    tests:
      sample:
        - args: [[[1, 10], [3, 30]], [1, 2], [0, 1], 0.0]
          expected: [[-1, -1], [1, 3]]
      generate: |
        def cases(rng):
            return [[rng.normal(size=(n, d)) * 4 + 3, rng.normal(size=d), rng.normal(size=d), 1e-5] for n, d in [(8, 3), (32, 6)]]
    explanation: |
      BatchNorm normalises each feature over the batch (`axis=0`), not all numbers together. `gamma` and `beta` are per-feature and let the network undo the normalisation if that helps. At inference, running averages of `μ` and `σ²` replace the batch statistics.

  - id: np-ridge-closed-form
    type: code
    title: Ridge regression, closed form
    difficulty: medium
    tags: [numpy, regression, regularisation]
    prompt: |
      Implement `ridge(X, y, lam)`: the weights $w$ minimising $\lVert Xw - y\rVert^2 + \lambda \lVert w\rVert^2$, i.e. $w = (X^\top X + \lambda I)^{-1} X^\top y$. (No bias term.) Use `np.linalg.solve`, not an explicit inverse.
    function:
      name: ridge
      params:
        - { name: X, type: ndarray }
        - { name: y, type: ndarray }
        - { name: lam, type: float }
      returns: "ndarray of length d"
    starter: |
      import numpy as np

      def ridge(X, y, lam):
          return np.linalg.solve(X.T @ X, X.T @ y)
    solution: |
      import numpy as np

      def ridge(X, y, lam):
          d = X.shape[1]
          return np.linalg.solve(X.T @ X + lam * np.eye(d), X.T @ y)
    tests:
      sample:
        - args: [[[1, 0], [0, 1], [1, 1]], [1, 2, 3], 1.0]
      generate: |
        def cases(rng):
            out = []
            for n, d, lam in [(20, 3, 0.5), (50, 6, 10.0)]:
                X = rng.normal(size=(n, d))
                out.append([X, X @ rng.normal(size=d) + rng.normal(size=n) * 0.1, float(lam)])
            return out
    explanation: |
      Adding $\lambda I$ to $X^\top X$ shrinks the weights and makes the system solvable even when features are collinear. `solve` is faster and more accurate than computing the inverse and multiplying.

  - id: np-knn-predict
    type: code
    title: k-nearest neighbours
    difficulty: medium
    tags: [numpy, knn, classification]
    prompt: |
      Implement `knn_predict(X_train, y_train, X_test, k)`: for each test point, find the `k` training points closest in Euclidean distance and predict their most common label. If labels tie in the vote, predict the **smallest** label. Labels are integers ≥ 0.
    function:
      name: knn_predict
      params:
        - { name: X_train, type: ndarray }
        - { name: y_train, type: ndarray_int }
        - { name: X_test, type: ndarray }
        - { name: k, type: int }
      returns: "int ndarray, one label per test point"
    starter: |
      import numpy as np

      def knn_predict(X_train, y_train, X_test, k):
          d = ((X_test[:, None, :] - X_train[None, :, :]) ** 2).sum(axis=2)
          return y_train[np.argmin(d, axis=1)]
    solution: |
      import numpy as np

      def knn_predict(X_train, y_train, X_test, k):
          d = ((X_test[:, None, :] - X_train[None, :, :]) ** 2).sum(axis=2)
          nearest = np.argsort(d, axis=1, kind="stable")[:, :k]
          votes = y_train[nearest]
          return np.array([np.bincount(row).argmax() for row in votes])
    tests:
      sample:
        - args: [[[0, 0], [0, 1], [5, 5], [6, 5]], [0, 0, 1, 1], [[0.2, 0.2], [5.5, 5.1]], 3]
          expected: [0, 1]
      generate: |
        def cases(rng):
            out = []
            for n, m, k in [(30, 10, 3), (60, 20, 5)]:
                y = rng.integers(0, 3, size=n)
                X = rng.normal(size=(n, 2)) + y[:, None] * 2.0
                out.append([X, y, rng.normal(size=(m, 2)) * 2 + 2, int(k)])
            return out
    explanation: |
      Broadcasting builds the full test × train distance matrix; `argsort` gives each test point's neighbours in order. `np.bincount(votes).argmax()` counts labels and returns the first (smallest) of the most common ones, which is exactly the tie rule. The starter is 1-NN.

  - id: np-kmeans-step
    type: code
    title: One k-means iteration
    difficulty: medium
    tags: [numpy, clustering, kmeans]
    prompt: |
      Implement `kmeans_step(X, C)`: one iteration of k-means. Assign each point of `X` to its nearest centroid in `C` (ties → lower centroid index), then return the new centroids: the mean of each cluster's points. A centroid with no points stays where it was.
    function:
      name: kmeans_step
      params:
        - { name: X, type: ndarray }
        - { name: C, type: ndarray }
      returns: "ndarray, same shape as C"
    starter: |
      import numpy as np

      def kmeans_step(X, C):
          d = ((X[:, None, :] - C[None, :, :]) ** 2).sum(axis=2)
          labels = d.argmin(axis=1)
          return np.array([X[labels == j].mean(axis=0) for j in range(len(C))])
    solution: |
      import numpy as np

      def kmeans_step(X, C):
          d = ((X[:, None, :] - C[None, :, :]) ** 2).sum(axis=2)
          labels = d.argmin(axis=1)
          new = C.copy()
          for j in range(len(C)):
              members = X[labels == j]
              if len(members):
                  new[j] = members.mean(axis=0)
          return new
    tests:
      sample:
        - args: [[[0, 0], [0, 2], [10, 10], [12, 10]], [[1, 1], [11, 11], [100, 100]]]
          expected: [[0, 1], [11, 10], [100, 100]]
      generate: |
        def cases(rng):
            X = np.vstack([rng.normal(size=(15, 3)), rng.normal(size=(15, 3)) + 6])
            return [[X, X[[0, 20, 5]] + 0.1], [X, np.vstack([X[[1, 2]], [[50.0, 50.0, 50.0]]])]]
    explanation: |
      `argmin` over the point × centroid distance matrix assigns clusters (it returns the first minimum, so ties go to the lower index). The mean of an empty selection is NaN with a warning, which is why empty clusters keep their old centroid — common alternatives re-seed them at a far-away point.

  - id: np-roc-auc
    type: code
    title: ROC AUC from scores
    difficulty: hard
    access: pro
    tags: [numpy, metrics, auc]
    prompt: |
      Implement `roc_auc(y, scores)`: the area under the ROC curve for binary labels `y` (0/1, both present) and real-valued `scores`. Use its probabilistic meaning: the share of (positive, negative) pairs where the positive has the higher score, counting ties as half.
    function:
      name: roc_auc
      params:
        - { name: y, type: ndarray_int }
        - { name: scores, type: ndarray }
      returns: "float in [0, 1]"
    starter: |
      import numpy as np

      def roc_auc(y, scores):
          return float(((scores > 0.5) == y).mean())
    solution: |
      import numpy as np

      def roc_auc(y, scores):
          pos = scores[y == 1]
          neg = scores[y == 0]
          diff = pos[:, None] - neg[None, :]
          return float(((diff > 0).sum() + 0.5 * (diff == 0).sum()) / (len(pos) * len(neg)))
    tests:
      sample:
        - args: [[0, 0, 1, 1], [0.1, 0.4, 0.35, 0.8]]
          expected: 0.75
      hidden:
        - args: [[1, 0, 1, 0], [0.5, 0.5, 0.9, 0.1]]
      generate: |
        def cases(rng):
            out = []
            for n in [20, 200]:
                y = rng.integers(0, 2, size=n)
                y[0], y[1] = 0, 1
                out.append([y, np.round(y * 0.6 + rng.random(n), 2)])
            return out
    hints:
      - "Compare every positive score with every negative score: broadcasting gives a (positives × negatives) matrix."
    explanation: |
      AUC equals the probability that a randomly chosen positive outranks a randomly chosen negative, so comparing all pairs computes it exactly. That's O(P·N); for large data, sort the scores once and use ranks (the Mann–Whitney U statistic). The starter is accuracy at a 0.5 threshold, a different metric.

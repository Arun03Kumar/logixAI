id: js-async
title: Promises and the event loop
summary: What runs when — the call stack, microtasks and timers — and the async utilities interviews ask you to build — Promise.all, retry with backoff, timeouts and a concurrency limit.
prerequisites: [js-closures]
lesson: |
  ## The event loop in one paragraph

  JavaScript runs one thing at a time. When the current code (the call stack) finishes, the engine first runs **every microtask** — promise callbacks (`.then`, the code after an `await`, `queueMicrotask`) — and only then takes the next **task** (a timer, an I/O callback, a click). So `setTimeout(f, 0)` always runs after promise callbacks queued at the same time.

  ## Promises

  A promise is pending, then settles once: fulfilled with a value or rejected with a reason. `.then` returns a **new** promise, which is why chains work. `async` functions always return a promise; `await p` pauses the function until `p` settles (rejection throws at the `await`).

  ```js
  // Sequential: total time is the sum.
  for (const id of ids) results.push(await load(id));

  // Concurrent: total time is the slowest.
  const results = await Promise.all(ids.map(load));
  ```

  ## Patterns to know

  | Need | Tool |
  | --- | --- |
  | all results, fail fast | `Promise.all` |
  | every outcome, never rejects | `Promise.allSettled` |
  | first to settle | `Promise.race` (timeouts) |
  | first success | `Promise.any` |
  | wait | `new Promise((r) => setTimeout(r, ms))` |

  A rejection nobody handles crashes Node and is reported in browsers — attach a handler to every promise you create.

  The tests here run on a fake clock: timers fire in order as the test advances time, and `Date.now()` returns the fake time.
items:
  - id: js-event-loop-order
    type: output
    language: javascript
    title: Microtasks before timers
    difficulty: medium
    tags: [javascript, event-loop, promises]
    prompt: |
      What does this print (Node.js)?
    snippet: |
      console.log("A");
      setTimeout(() => console.log("B"), 0);
      Promise.resolve().then(() => console.log("C"));
      queueMicrotask(() => console.log("D"));
      (async () => {
        console.log("E");
        await null;
        console.log("F");
      })();
      console.log("G");
    answer: |
      A
      E
      G
      C
      D
      F
      B
    explanation: |
      Synchronous code first: `A`, then the async function runs **synchronously up to its first `await`** (`E`), then `G`. Next the microtask queue, in the order things were queued: `C`, `D`, and the rest of the async function `F`. Only then does the timer task run: `B`, even with a 0 ms delay.

  - id: js-await-in-foreach
    type: mcq_single
    title: await inside forEach
    difficulty: easy
    tags: [javascript, async-await]
    prompt: |
      ```js
      async function saveAll(ids) {
        ids.forEach(async (id) => {
          await save(id);
        });
        console.log("all saved");
      }
      ```
      What's wrong?
    options:
      - { id: a, text: "Nothing: forEach waits for each async callback" }
      - { id: b, text: "\"all saved\" logs before any save finishes, and errors from save become unhandled rejections; use for...of with await, or await Promise.all(ids.map(save))" }
      - { id: c, text: "It's a syntax error to use async in a forEach callback" }
      - { id: d, text: "The saves run one after another, so it's slow" }
    answer: b
    explanation: |
      `forEach` ignores its callback's return value — here a promise — so nothing waits for it. Every `save` starts at once, the log runs immediately, and a rejection has no handler. `for (const id of ids) await save(id)` runs them in order; `await Promise.all(ids.map(save))` runs them together and waits for all.

  - id: js-promise-all
    type: code
    language: javascript
    title: Implement Promise.all
    difficulty: medium
    tags: [javascript, promises]
    prompt: |
      Implement `promiseAll(items)` without `Promise.all`, `allSettled`, `any` or `race` (the test removes them). It returns a promise that:

      - fulfils with an array of results **in input order** once every item has fulfilled (plain values count as already fulfilled; an empty array fulfils immediately with `[]`);
      - rejects with the first rejection reason **as soon as** any item rejects.

      The test builds the inputs from `[kind, ms, value]` specs (`"ok"` fulfils after `ms`, `"fail"` rejects after `ms`, `"plain"` is just the value) and records when your promise settled.
    expose: [promiseAll]
    driver: |
      async function check(specs) {
        const clock = __lx.useFakeTimers();
        Promise.all = Promise.allSettled = Promise.any = Promise.race = undefined;
        const items = specs.map(([kind, ms, value]) =>
          kind === "plain" ? value : new Promise((resolve, reject) => setTimeout(() => (kind === "ok" ? resolve(value) : reject(new Error(value))), ms)),
        );
        let outcome = "still pending";
        promiseAll(items).then(
          (value) => { outcome = { at: Date.now(), value }; },
          (error) => { outcome = { at: Date.now(), error: error.message }; },
        );
        await clock.tick(5000);
        return outcome;
      }
    function:
      name: check
      params:
        - { name: specs, type: list }
      returns: "when and how the promise settled"
    starter: |
      async function promiseAll(items) {
        const results = [];
        for (const item of items) {
          results.push(await item);
        }
        return results;
      }
    solution: |
      function promiseAll(items) {
        return new Promise((resolve, reject) => {
          const results = new Array(items.length);
          let remaining = items.length;
          if (remaining === 0) return resolve(results);
          items.forEach((item, i) => {
            Promise.resolve(item).then((value) => {
              results[i] = value;
              remaining -= 1;
              if (remaining === 0) resolve(results);
            }, reject);
          });
        });
      }
    tests:
      sample:
        - args: [[["ok", 300, "a"], ["ok", 100, "b"], ["plain", 0, "c"]]]
      hidden:
        - args: [[["ok", 500, 1], ["fail", 100, "boom"], ["ok", 50, 3]]]
        - args: [[]]
        - args: [[["fail", 200, "first"], ["fail", 100, "second"]]]
    hints:
      - "Write each result into its index, and count how many are left."
      - "`Promise.resolve(item)` turns plain values into promises."
    explanation: |
      Subscribe to every item at once and store each result at its index — results arrive in any order, but the output must follow the input. A counter (not `results.length`, which jumps when a later index is set) says when all are in. Passing `reject` to every item rejects on the **first** failure; later calls to `resolve`/`reject` are ignored because a promise settles once. The starter awaits items one by one, so it notices a fast failure only after the slow items before it, and the failure sits unhandled meanwhile.

  - id: js-retry-backoff
    type: code
    language: javascript
    title: Retry with exponential backoff
    difficulty: medium
    tags: [javascript, promises, resilience]
    prompt: |
      Implement `retry(fn, retries, baseMs)`. `fn()` returns a promise. Call it; if it rejects, wait `baseMs * 2 ** attempt` ms (`attempt` = 0 for the first retry, then 1, 2, ...) and call it again, up to `retries` retries. Return a promise that fulfils with the first success, or rejects with the **last** error once retries run out.

      The test's `fn` fails a set number of times before succeeding and records when it was called (fake clock).
    expose: [retry]
    driver: |
      async function check(failures, retries, baseMs) {
        const clock = __lx.useFakeTimers();
        const calledAt = [];
        let n = 0;
        const flaky = () => {
          calledAt.push(Date.now());
          n += 1;
          return n <= failures ? Promise.reject(new Error("fail " + n)) : Promise.resolve("ok on call " + n);
        };
        let outcome = "still pending";
        retry(flaky, retries, baseMs).then(
          (value) => { outcome = { value }; },
          (error) => { outcome = { error: error.message }; },
        );
        await clock.tick(100000);
        return { outcome, calledAt };
      }
    function:
      name: check
      params:
        - { name: failures, type: int }
        - { name: retries, type: int }
        - { name: baseMs, type: int }
      returns: "the outcome and the times fn was called"
    starter: |
      async function retry(fn, retries, baseMs) {
        for (let attempt = 0; ; attempt++) {
          try {
            return await fn();
          } catch (err) {
            if (attempt >= retries) throw err;
          }
        }
      }
    solution: |
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      async function retry(fn, retries, baseMs) {
        for (let attempt = 0; ; attempt++) {
          try {
            return await fn();
          } catch (err) {
            if (attempt >= retries) throw err;
            await sleep(baseMs * 2 ** attempt);
          }
        }
      }
    tests:
      sample:
        - args: [2, 3, 100]
      hidden:
        - args: [0, 3, 100]
        - args: [5, 3, 50]
        - args: [3, 3, 10]
    explanation: |
      Waiting longer after each failure (100, 200, 400 ms ...) gives a struggling server room to recover instead of hammering it. The loop keeps the last error to rethrow. The starter retries instantly, which is how a brief outage turns into a self-inflicted overload. Production code also adds random **jitter** so many clients don't retry in lockstep.

  - id: js-with-timeout
    type: code
    language: javascript
    title: A timeout that cleans up
    difficulty: medium
    access: pro
    tags: [javascript, promises, timers]
    prompt: |
      Implement `withTimeout(promise, ms)`: settle like `promise` if it settles within `ms`; otherwise reject with `new Error("timeout")` at `ms`. Whichever happens, **don't leave a timer running** afterwards.

      The test records how and when it settled, and how many timers are still pending at the end.
    expose: [withTimeout]
    driver: |
      async function check(kind, settleMs, timeoutMs) {
        const clock = __lx.useFakeTimers();
        const work = new Promise((resolve, reject) => setTimeout(() => (kind === "ok" ? resolve("done") : reject(new Error("failed"))), settleMs));
        work.catch(() => {});
        let outcome = "still pending";
        withTimeout(work, timeoutMs).then(
          (value) => { outcome = { at: Date.now(), value }; },
          (error) => { outcome = { at: Date.now(), error: error.message }; },
        );
        await clock.tick(Math.min(settleMs, timeoutMs) + 1);
        const timersLeft = clock.pending();
        await clock.tick(100000);
        return { outcome, timersLeftAfterSettling: timersLeft };
      }
    function:
      name: check
      params:
        - { name: kind, type: str }
        - { name: settleMs, type: int }
        - { name: timeoutMs, type: int }
      returns: "the outcome and leftover timers"
    starter: |
      function withTimeout(promise, ms) {
        const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms));
        return Promise.race([promise, timeout]);
      }
    solution: |
      function withTimeout(promise, ms) {
        let timer;
        const timeout = new Promise((_, reject) => {
          timer = setTimeout(() => reject(new Error("timeout")), ms);
        });
        return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
      }
    tests:
      sample:
        - args: ["ok", 100, 500]
      hidden:
        - args: ["ok", 900, 300]
        - args: ["fail", 50, 1000]
    explanation: |
      `Promise.race` settles with whichever promise settles first, but it doesn't cancel the loser: the starter leaves the timeout timer pending after the work finishes. In a server handling thousands of requests, those timers keep memory and keep Node from exiting. `.finally(() => clearTimeout(timer))` cleans up on every path. (The `outcome` is the same either way, which is why this bug survives code review.)

  - id: js-map-limit
    type: code
    language: javascript
    title: Run async work with a concurrency limit
    difficulty: hard
    access: pro
    tags: [javascript, promises, concurrency]
    prompt: |
      Implement `mapLimit(items, limit, fn)`: call `fn(item)` (which returns a promise) for every item, with **at most `limit` calls in flight** at any time, starting the next item as soon as one finishes. Return a promise of all results **in input order**. If any call rejects, reject with that error.

      The test's `fn` takes `item` ms and resolves with `item * 2`; it records the maximum number of calls in flight and when everything finished (fake clock).
    expose: [mapLimit]
    driver: |
      async function check(items, limit) {
        const clock = __lx.useFakeTimers();
        let inFlight = 0;
        let maxInFlight = 0;
        const started = [];
        const fn = (ms) => {
          started.push([Date.now(), ms]);
          inFlight += 1;
          maxInFlight = Math.max(maxInFlight, inFlight);
          return new Promise((resolve) => setTimeout(() => { inFlight -= 1; resolve(ms * 2); }, ms));
        };
        let outcome = "still pending";
        mapLimit(items, limit, fn).then((results) => { outcome = { at: Date.now(), results }; }, (e) => { outcome = { error: e.message }; });
        await clock.tick(100000);
        return { outcome, maxInFlight, started };
      }
    function:
      name: check
      params:
        - { name: items, type: list }
        - { name: limit, type: int }
      returns: "results, finish time, peak concurrency and start times"
    starter: |
      function mapLimit(items, limit, fn) {
        return Promise.all(items.map((item) => fn(item)));
      }
    solution: |
      function mapLimit(items, limit, fn) {
        return new Promise((resolve, reject) => {
          const results = new Array(items.length);
          let next = 0;
          let done = 0;
          let failed = false;
          if (items.length === 0) return resolve(results);
          const launch = () => {
            if (failed || next >= items.length) return;
            const i = next++;
            Promise.resolve(fn(items[i])).then((value) => {
              results[i] = value;
              done += 1;
              if (done === items.length) resolve(results);
              else launch();
            }, (err) => {
              failed = true;
              reject(err);
            });
          };
          for (let k = 0; k < Math.min(limit, items.length); k++) launch();
        });
      }
    tests:
      sample:
        - args: [[300, 100, 200, 50], 2]
      hidden:
        - args: [[10, 10, 10, 10, 10], 1]
        - args: [[], 3]
        - args: [[100, 20, 30, 40, 500, 60], 3]
        - args: [[70, 30], 5]
    hints:
      - "Start `limit` workers; each one, when its call finishes, takes the next unstarted index."
    explanation: |
      Keep a shared `next` index. Start `limit` calls; whenever one finishes, store its result at its own index and launch the next item. That keeps exactly `limit` running until the queue drains, so a slow item doesn't block the others (unlike splitting into fixed batches of `limit`, which waits for each batch's slowest). The starter launches everything at once — fine for 4 items, a self-inflicted outage for 10,000 requests to an API with a rate limit.

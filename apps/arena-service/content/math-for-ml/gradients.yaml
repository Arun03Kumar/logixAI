id: gradients
title: Gradients and gradient descent
summary: Partial derivatives, the gradient vector, and the update rule that trains almost every model.
prerequisites: [derivatives, vectors]
lesson: |
  ## Why gradients matter

  A model's loss depends on many parameters at once. The **gradient** collects the slope with respect to each of them into one vector, and gradient descent follows it downhill. This single idea trains linear regression, logistic regression and every neural network.

  ## Partial derivatives

  For $f(x, y)$, the partial derivative $\frac{\partial f}{\partial x}$ treats $y$ as a constant and differentiates in $x$.
  Example: $f(x, y) = x^2 y + 3y$ gives $\frac{\partial f}{\partial x} = 2xy$ and $\frac{\partial f}{\partial y} = x^2 + 3$.

  ## The gradient

  $$\nabla f(\mathbf{w}) = \left[\frac{\partial f}{\partial w_1}, \ldots, \frac{\partial f}{\partial w_n}\right]$$

  It points in the direction of **steepest increase**, and its length says how steep that is. So $-\nabla f$ is the steepest way down.

  ## Gradient descent

  $$\mathbf{w} \leftarrow \mathbf{w} - \eta \, \nabla f(\mathbf{w})$$

  $\eta$ is the **learning rate**. Too small and training crawls; too large and each step overshoots the minimum, so the loss bounces or explodes.

  ## Worked example

  $f(w) = (w - 3)^2$, $f'(w) = 2(w - 3)$. From $w = 0$ with $\eta = 0.1$:
  $w_1 = 0 - 0.1 \cdot (-6) = 0.6$, $w_2 = 0.6 - 0.1 \cdot (-4.8) = 1.08$, … heading to 3.
  With $\eta = 1.1$ each step overshoots further: $w$ swings between ever larger values — divergence.

  ## Variants

  - **Batch** gradient descent uses the whole dataset per step (stable, slow).
  - **Stochastic** (SGD) uses one example (noisy, cheap).
  - **Mini-batch** uses, say, 32–512 examples — the default in deep learning.

  Try it in the **Gradient descent lab** to see how the learning rate changes the path.

  ## In interviews

  "Your loss is going up during training — why?" The first answer is a learning rate that's too high.
items:
  - id: grad-partial-numeric
    type: numeric
    title: A partial derivative
    difficulty: easy
    tags: [partial-derivatives]
    prompt: |
      $f(x, y) = 3x^2y + y^3$. What is $\dfrac{\partial f}{\partial y}$ at $(x, y) = (1, 2)$?
    answer: 15
    tolerance: 0
    hints:
      - Treat $x$ as a constant.
    explanation: |
      $\frac{\partial f}{\partial y} = 3x^2 + 3y^2$, so at $(1, 2)$: $3 + 12 = 15$.

  - id: grad-step-numeric
    type: numeric
    title: One gradient descent step
    difficulty: easy
    tags: [gradient-descent]
    prompt: |
      Minimising $f(w) = w^2 + 4w$ with gradient descent, learning rate $\eta = 0.25$, starting at $w = 2$. What is $w$ after **one** step?
    answer: 0
    tolerance: 0.0001
    hints:
      - $f'(w) = 2w + 4$.
    explanation: |
      $f'(2) = 8$, so $w \leftarrow 2 - 0.25 \cdot 8 = 0$. The minimum is at $w = -2$; another step gives $0 - 0.25 \cdot 4 = -1$.

  - id: grad-lr-mcq
    type: mcq_single
    title: A loss that explodes
    difficulty: easy
    tags: [learning-rate, debugging]
    prompt: |
      During training the loss goes 2.3 → 4.1 → 19.6 → `inf`. What is the most likely cause?
    options:
      - { id: a, text: "The learning rate is too high." }
      - { id: b, text: "The learning rate is too low." }
      - { id: c, text: "The model is overfitting." }
      - { id: d, text: "The dataset is too large." }
    answer: a
    explanation: |
      Each step overshoots the minimum by more than the last, so the loss grows until it overflows. A too-low rate makes the loss fall slowly, and overfitting shows up as validation loss rising while training loss keeps falling.

  - id: grad-descent-code
    type: code
    title: Gradient descent on a quadratic bowl
    difficulty: medium
    tags: [gradient-descent, numpy]
    prompt: |
      Minimise $f(\mathbf{w}) = \lVert \mathbf{w} - \mathbf{c} \rVert^2$ with gradient descent.

      Implement `gradient_descent(c, w0, lr, steps)`: start at `w0`, apply `steps` updates
      $\mathbf{w} \leftarrow \mathbf{w} - \eta \nabla f(\mathbf{w})$ with $\nabla f(\mathbf{w}) = 2(\mathbf{w} - \mathbf{c})$,
      and return the final `w` as an array.
    function:
      name: gradient_descent
      params:
        - { name: c, type: ndarray }
        - { name: w0, type: ndarray }
        - { name: lr, type: float }
        - { name: steps, type: int }
      returns: ndarray
    starter: |
      import numpy as np

      def gradient_descent(c, w0, lr, steps):
          w = w0.copy()
          for _ in range(steps):
              grad = ...
              w = ...
          return w
    solution: |
      import numpy as np

      def gradient_descent(c, w0, lr, steps):
          w = w0.copy()
          for _ in range(steps):
              grad = 2 * (w - c)
              w = w - lr * grad
          return w
    tests:
      sample:
        - args: [[3.0], [0.0], 0.1, 1]
          expected: [0.6]
        - args: [[1.0, -2.0], [0.0, 0.0], 0.1, 50]
      hidden:
        - args: [[5.0, 5.0], [5.0, 5.0], 0.3, 10]
          expected: [5.0, 5.0]
        - args: [[2.0], [0.0], 0.0, 100]
          expected: [0.0]
      generate: |
        def cases(rng):
            return [[rng.normal(size=3), rng.normal(size=3), float(rng.uniform(0.01, 0.4)), int(rng.integers(1, 40))] for _ in range(4)]
    hints:
      - The update is `w = w - lr * grad`.
    explanation: |
      Each step moves `w` a fraction of the way to `c`: $\mathbf{w} - \mathbf{c}$ shrinks by a factor $(1 - 2\eta)$ per step. With $\eta = 0.5$ it lands in one step; with $\eta > 1$ the factor's magnitude exceeds 1 and it diverges.

  - id: grad-numerical-gradient-code
    type: code
    title: Gradient checking
    difficulty: hard
    access: pro
    tags: [gradient-checking, numerical-differentiation]
    prompt: |
      Gradient checking compares a hand-written gradient with a numerical one.

      For $f(\mathbf{w}) = \sum_i a_i w_i^2 + \sum_i b_i w_i$, implement `numerical_gradient(a, b, w, h)`:
      return the vector of central differences $\dfrac{f(\mathbf{w} + h\mathbf{e}_i) - f(\mathbf{w} - h\mathbf{e}_i)}{2h}$,
      one per coordinate $i$ ($\mathbf{e}_i$ is the $i$-th unit vector).

      Answers are checked to within `1e-4`.
    function:
      name: numerical_gradient
      params:
        - { name: a, type: ndarray }
        - { name: b, type: ndarray }
        - { name: w, type: ndarray }
        - { name: h, type: float }
      returns: ndarray
    starter: |
      import numpy as np

      def numerical_gradient(a, b, w, h):
          def f(v):
              return float(np.sum(a * v ** 2) + np.sum(b * v))
          grad = np.zeros_like(w)
          # Nudge one coordinate at a time.
          return grad
    solution: |
      import numpy as np

      def numerical_gradient(a, b, w, h):
          def f(v):
              return float(np.sum(a * v ** 2) + np.sum(b * v))
          grad = np.zeros_like(w)
          for i in range(len(w)):
              step = np.zeros_like(w)
              step[i] = h
              grad[i] = (f(w + step) - f(w - step)) / (2 * h)
          return grad
    tolerance: { abs: 1.0e-4, rel: 1.0e-6 }
    tests:
      sample:
        - args: [[1.0, 2.0], [0.0, -1.0], [3.0, 1.0], 0.001]
          expected: [6.0, 3.0]
      hidden:
        - args: [[0.0], [5.0], [10.0], 0.01]
          expected: [5.0]
      generate: |
        def cases(rng):
            return [[rng.normal(size=n), rng.normal(size=n), rng.normal(size=n), 0.001] for n in [3, 8, 20]]
    hints:
      - Build a unit step for coordinate `i` with `np.zeros_like(w)` and set one entry to `h`.
      - "Don't modify `w` in place — or if you do, put it back."
    explanation: |
      The analytic gradient is $2a_iw_i + b_i$; the numerical one should agree to about $h^2$. If a backprop implementation disagrees with this check, the backprop is wrong. It costs two function evaluations per parameter, so it's a debugging tool, not a training method.

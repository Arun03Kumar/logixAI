id: py-data-structures
title: Core data structures
summary: Lists, tuples, sets and dictionaries — what each is for, their key operations and costs — plus mutability, references, shallow vs deep copies and choosing the right structure.
prerequisites: [py-strings]
lesson: |
  ## 4.1 Lists

  An ordered, **mutable** collection: `scores = [72, 91, 85]`. Index and slice like strings. Common operations: `append(x)` (add to end), `extend(iterable)`, `insert(i, x)`, `pop()` / `pop(i)`, `remove(x)` (first match), `sort()` (in place, returns `None`) vs `sorted(lst)` (new list), `reverse()`, `x in lst`, `lst.count(x)`, `lst.index(x)`. Appending and popping at the end are fast; inserting or removing at the front shifts everything (use `collections.deque` for queues). Membership `x in lst` scans the whole list.

  ## 4.2 Tuples

  Ordered and **immutable**: `point = (3, 4)`. Use them for fixed records (a row, a coordinate, a function returning several values). One-element tuple: `(5,)` — the comma makes the tuple, not the brackets. **Unpacking**: `x, y = point`; `first, *rest = [1, 2, 3]`. Because they're immutable (if their contents are), tuples can be dictionary keys and set members.

  ## 4.3 Sets

  Unordered collections of **unique**, hashable items: `{"a", "b"}` (an empty set is `set()`, since `{}` is a dict). Membership is fast (hashing), so `x in big_set` beats `x in big_list`. Set algebra: `a | b` union, `a & b` intersection, `a - b` difference, `a ^ b` symmetric difference. `set(lst)` removes duplicates (but loses order — use `dict.fromkeys(lst)` to keep it).

  ## 4.4 Dictionaries

  Key → value mappings with fast lookup, keeping **insertion order**: `ages = {"asha": 21}`. `d[k]` raises `KeyError` if missing; `d.get(k, default)` doesn't. Iterate with `for k, v in d.items()`. `d.setdefault(k, [])`, `collections.Counter` (counting) and `collections.defaultdict(list)` (grouping) remove boilerplate. Keys must be hashable (strings, numbers, tuples — not lists). Merge with `{**a, **b}` or `a | b` (later wins).

  ## 4.5 Mutability, references, copying and choosing

  Assignment never copies — it binds another **name to the same object**:

  ```python
  a = [1, 2]
  b = a          # same list
  b.append(3)    # a is now [1, 2, 3] too
  ```

  `a.copy()`, `list(a)` or `a[:]` make a **shallow** copy (a new outer list holding the same inner objects); `copy.deepcopy(a)` copies nested objects too. `==` compares values, `is` compares identity. A classic bug: a mutable default argument (`def f(x, seen=[])`) is shared across calls (Section 6).

  | Need | Use |
  | --- | --- |
  | ordered, changing sequence | list |
  | fixed record / dict key | tuple |
  | uniqueness, fast membership | set |
  | lookup by key, counting, grouping | dict |
items:
  - id: py4-sort-none
    type: output
    title: sort vs sorted
    difficulty: easy
    tags: [python, lists]
    prompt: |
      What does this print?
    snippet: |
      nums = [3, 1, 2]
      result = nums.sort()
      print(result, nums)
      print(sorted([3, 1, 2], reverse=True))
    answer: |
      None [1, 2, 3]
      [3, 2, 1]
    explanation: |
      `list.sort()` sorts in place and returns `None` — writing `nums = nums.sort()` loses your data. `sorted()` returns a new list and works on any iterable.

  - id: py4-aliasing
    type: output
    title: Two names, one list
    difficulty: medium
    tags: [python, lists, references]
    prompt: |
      What does this print?
    snippet: |
      import copy
      a = [[1, 2], [3]]
      b = a
      c = a.copy()
      d = copy.deepcopy(a)
      a[0].append(99)
      a.append([4])
      print(b)
      print(c)
      print(d)
    answer: |
      [[1, 2, 99], [3], [4]]
      [[1, 2, 99], [3]]
      [[1, 2], [3]]
    explanation: |
      `b` is the same list as `a`. `c` is a shallow copy: a new outer list, but its first element is the **same** inner list, so the append to `a[0]` shows through, while the new `[4]` doesn't. `d` copied everything.

  - id: py4-tuple-comma
    type: mcq_single
    title: Which is a tuple?
    difficulty: easy
    tags: [python, tuples]
    prompt: |
      Which of these is a tuple containing one element?
    options:
      - { id: a, text: "`(5)`" }
      - { id: b, text: "`(5,)`" }
      - { id: c, text: "`[5]`" }
      - { id: d, text: "`tuple(5)`" }
    answer: b
    explanation: |
      The **comma** makes a tuple; `(5)` is just the number 5 in brackets. `tuple(5)` fails because 5 isn't iterable — `tuple([5])` works.

  - id: py4-set-ops
    type: output
    title: Set algebra
    difficulty: easy
    tags: [python, sets]
    prompt: |
      What does this print? (Sets are shown sorted to keep the output stable.)
    snippet: |
      jan = {"asha", "ravi", "meera"}
      feb = {"ravi", "kiran"}
      print(sorted(jan | feb))
      print(sorted(jan & feb))
      print(sorted(jan - feb))
      print(type({}).__name__, type(set()).__name__)
    answer: |
      ['asha', 'kiran', 'meera', 'ravi']
      ['ravi']
      ['asha', 'meera']
      dict set
    explanation: |
      Union = active in either month, intersection = retained customers, difference = churned since January. `{}` creates an empty **dict**; an empty set needs `set()`.

  - id: py4-dict-get
    type: output
    title: Safe lookups
    difficulty: easy
    tags: [python, dict]
    prompt: |
      What does this print?
    snippet: |
      prices = {"pen": 20, "book": 250}
      print(prices.get("pen"), prices.get("bag"), prices.get("bag", 0))
      prices["bag"] = prices.get("bag", 0) + 500
      print(list(prices), len(prices))
    answer: |
      20 None 0
      ['pen', 'book', 'bag'] 3
    explanation: |
      `get` returns `None` (or your default) instead of raising `KeyError`. Dicts keep insertion order, so the new key comes last; `list(d)` gives the keys.

  - id: py4-unique-ordered
    type: code
    title: Remove duplicates, keep order
    difficulty: easy
    tags: [python, sets, dict]
    prompt: |
      Write `unique(items)` returning the items without duplicates, in the order they first appeared.
    function:
      name: unique
      params:
        - { name: items, type: list }
      returns: "list"
    starter: |
      def unique(items):
          return list(set(items))
    solution: |
      def unique(items):
          seen = set()
          out = []
          for x in items:
              if x not in seen:
                  seen.add(x)
                  out.append(x)
          return out
    tests:
      sample:
        - args: [["b", "a", "b", "c", "a"]]
      hidden:
        - args: [[]]
        - args: [[3, 1, 3, 2, 1, 3]]
    explanation: |
      A set gives fast membership checks while a list keeps the order. `list(set(items))` removes duplicates but in an arbitrary order. A one-liner that also works: `list(dict.fromkeys(items))`.

  - id: py4-group-by
    type: code
    title: Group rows by a key
    difficulty: medium
    tags: [python, dict, grouping]
    prompt: |
      Rows are `[name, city]` pairs. Write `by_city(rows)` returning a dict mapping each city to the list of names in that city, in input order.
    function:
      name: by_city
      params:
        - { name: rows, type: list }
      returns: "dict of lists"
    starter: |
      def by_city(rows):
          out = {}
          for name, city in rows:
              out[city] = [name]
          return out
    solution: |
      from collections import defaultdict

      def by_city(rows):
          out = defaultdict(list)
          for name, city in rows:
              out[city].append(name)
          return dict(out)
    tests:
      sample:
        - args: [[["asha", "Pune"], ["ravi", "Delhi"], ["meera", "Pune"]]]
      hidden:
        - args: [[]]
        - args: [[["a", "X"], ["b", "X"], ["c", "X"]]]
    explanation: |
      `defaultdict(list)` creates an empty list the first time a key is used, so `append` always works. The starter replaces the list each time, keeping only the last name per city. This is what `df.groupby("city")["name"].apply(list)` does in Pandas.

  - id: py4-counter
    type: code
    title: Count and rank categories
    difficulty: easy
    tags: [python, dict, counting]
    prompt: |
      Write `counts(labels)` returning a dict from each label to how many times it appears.
    function:
      name: counts
      params:
        - { name: labels, type: list }
      returns: "dict"
    starter: |
      def counts(labels):
          out = {}
          for x in labels:
              out[x] = 1
          return out
    solution: |
      from collections import Counter

      def counts(labels):
          return dict(Counter(labels))
    tests:
      sample:
        - args: [["spam", "ham", "spam", "spam"]]
      hidden:
        - args: [[]]
        - args: [["a", "b", "c"]]
    explanation: |
      `Counter` counts in one pass; the manual version is `out[x] = out.get(x, 0) + 1`. Checking class balance like this is the first thing to do with a classification dataset.

  - id: py4-choose
    type: mcq_single
    title: Choose the structure
    difficulty: medium
    tags: [python, data-structures]
    prompt: |
      You need to check, millions of times, whether a user id is in a list of 100,000 blocked ids. What should hold the blocked ids?
    options:
      - { id: a, text: "A list — it keeps the ids in order" }
      - { id: b, text: "A set — membership checks take about constant time" }
      - { id: c, text: "A tuple — it's immutable and therefore faster to search" }
      - { id: d, text: "A string of comma-separated ids" }
    answer: b
    explanation: |
      `x in list` (and `in tuple`) scans every element: 100,000 comparisons per check. A set hashes the id and jumps to it. Converting once with `set(blocked)` turns millions of scans into millions of instant lookups.

  - id: py4-dict-keys
    type: mcq_multi
    title: Valid dictionary keys
    difficulty: medium
    tags: [python, dict, hashing]
    prompt: |
      Which can be dictionary keys? Select all that apply.
    options:
      - { id: a, text: '`"pune"`' }
      - { id: b, text: "`(18.52, 73.85)`" }
      - { id: c, text: "`[18.52, 73.85]`" }
      - { id: d, text: "`42`" }
      - { id: e, text: "`{1, 2}`" }
    answer: [a, b, d]
    explanation: |
      Keys must be **hashable**, which means immutable for built-in types: strings, numbers and tuples (of hashables). Lists and sets can change, so their hash couldn't stay fixed — use a tuple or `frozenset` instead.
